name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-marketplace:
    name: Marketplace (HACS action)
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  checks:
    name: Blueprints, strategy e versão
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python compila
        run: python -m compileall -q custom_components
      - name: Blueprints e traduções
        run: |
          pip install --quiet pyyaml
          python scripts/check.py
      - name: Strategy (gera o dashboard com um carro de exemplo)
        run: node --test tests/
